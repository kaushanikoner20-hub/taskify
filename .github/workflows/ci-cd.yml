name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 1. Backend tests - real tests against a real, disposable Postgres
  #    instance (a GitHub Actions service container), not against SQLite
  #    or a mock. Exercises actual validation, auth enforcement, and a
  #    regression check for a real bug that shipped (the weekly progress
  #    chart only returning days that had logged hours).
  # ---------------------------------------------------------------------
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskify_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: taskify_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci_test_secret_do_not_use_in_production
      JWT_EXPIRES_IN: 1h
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Run backend tests
        working-directory: backend
        run: npm test

  # ---------------------------------------------------------------------
  # 2. Docker build (+ conditional push). Builds both application images
  #    on every push/PR/manual run to verify they build cleanly (this is
  #    also how the frontend's Tailwind build gets verified - it runs
  #    inside the frontend Dockerfile's build stage). Only pushes to
  #    Docker Hub when running on a push (or manual dispatch) against the
  #    main branch - pull requests never get Docker Hub credentials.
  # ---------------------------------------------------------------------
  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: backend-test
    strategy:
      matrix:
        image: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub is only reachable with a real username, so on PRs (or
      # pushes to branches other than main) we tag the image locally
      # instead of guessing at a Docker Hub repo name that may not exist.
      - name: Determine image tags
        id: meta
        shell: bash
        run: |
          if [ "${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}" = "true" ]; then
            {
              echo "tags<<EOF"
              echo "${{ secrets.DOCKERHUB_USERNAME }}/taskify-${{ matrix.image }}:latest"
              echo "${{ secrets.DOCKERHUB_USERNAME }}/taskify-${{ matrix.image }}:${{ github.sha }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "taskify-${{ matrix.image }}:ci-build"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main) ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          push: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ---------------------------------------------------------------------
  # 3. Full-stack integration smoke test. Runs the exact same
  #    `docker compose up --build` a real user would run, then verifies
  #    the backend health endpoint and the frontend both respond. This
  #    runs on every push/PR/manual trigger - it doesn't touch Docker Hub
  #    at all, so it needs no secrets and is safe to run on PRs.
  # ---------------------------------------------------------------------
  integration-test:
    name: Full stack integration test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for backend health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health; then
              echo ""
              echo "Backend is healthy."
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "Backend did not become healthy in time."
          exit 1

      - name: Verify frontend responds
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Frontend is responding."
              exit 0
            fi
            echo "Waiting for frontend... ($i/20)"
            sleep 5
          done
          echo "Frontend did not respond in time."
          exit 1

      - name: Show container status
        if: always()
        run: docker ps

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------
  # 4. Optional deployment. Only runs on a push to main or a manual
  #    trigger - never on pull requests. If DEPLOY_HOST / DEPLOY_USERNAME
  #    / DEPLOY_SSH_KEY secrets are not all set, this job succeeds
  #    without attempting anything (it does not fail the pipeline just
  #    because no remote host has been provisioned yet).
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy (optional)
    runs-on: ubuntu-latest
    needs: [docker-build, integration-test]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check deployment secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USERNAME }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to remote Docker host over SSH
        if: steps.check.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$DEPLOY_USERNAME@$DEPLOY_HOST" \
            "cd taskify && docker compose pull && docker compose up -d"

      - name: Deployment skipped (no remote host configured)
        if: steps.check.outputs.configured == 'false'
        run: |
          echo "DEPLOY_HOST, DEPLOY_USERNAME, and DEPLOY_SSH_KEY are not all set as secrets."
          echo "Skipping remote deployment - Docker Hub publishing above still ran normally."
          echo "See the 'Enabling remote deployment' section in README.md to enable this."