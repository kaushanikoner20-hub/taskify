services:
  db:
    image: postgres:16-alpine
    container_name: taskify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskify}
      POSTGRES_USER: ${POSTGRES_USER:-taskify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - taskify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskify_user} -d ${POSTGRES_DB:-taskify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskify-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskify-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-taskify}
      DB_USER: ${POSTGRES_USER:-taskify_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${BACKEND_PORT:-4000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - taskify-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskify-net

networks:
  taskify-net:
    driver: bridge

volumes:
  taskify_db_data: