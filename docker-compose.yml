services:
  db:
    image: postgres:16-alpine
    container_name: taskify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskify}
      POSTGRES_USER: ${POSTGRES_USER:-taskify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - taskify_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskify_user} -d ${POSTGRES_DB:-taskify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskify-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskify-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-taskify}
      DB_USER: ${POSTGRES_USER:-taskify_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${BACKEND_PORT:-4000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - taskify-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskify-net

  # ---------------------------------------------------------------------
  # LocalStack - AWS-compatible emulator, used ONLY by the Terraform
  # assignment (terraform/) to provision an S3 bucket locally. It is not
  # wired into the Taskify application itself (frontend/backend never
  # talk to it) - it exists purely so Terraform has something to talk to.
  #
  # As of 2026, LocalStack requires a free personal account + auth token
  # to start the container at all - this applies to every tag on Docker
  # Hub, including older/historical ones, not just new releases. Get a
  # free token at https://app.localstack.cloud/ (no credit card, no real
  # AWS account needed) and set LOCALSTACK_AUTH_TOKEN in your .env file
  # (never commit that value - .env is gitignored).
  # ---------------------------------------------------------------------
  localstack:
    image: localstack/localstack:latest
    container_name: taskify-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SERVICES: s3
      DEBUG: 0
      DEFAULT_REGION: us-east-1
    volumes:
      - taskify_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - taskify-net

networks:
  taskify-net:
    driver: bridge

volumes:
  taskify_db_data:
  taskify_localstack_data: